name: Release ChronoMorph

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
        default: v1.4.6

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CGO_ENABLED: '0'
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the standalone Windows EXE and ZIP
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          dest=$(cygpath -u "$RUNNER_TEMP")
          pkg="$dest/winpkg"
          mkdir -p "$pkg" "$dest/Windows package test"
          flags="-s -w -H=windowsgui -X main.AppVersion=$VERSION -X main.BuildTime=$(git show -s --format=%cs HEAD)"
          exe=ChronoMorph-windows-amd64.exe
          go build -mod=readonly -trimpath -buildvcs=false -ldflags="$flags" -o "$dest/$exe" .
          cp "$dest/$exe" "$dest/Windows package test/"
          cp "$dest/$exe" assets/licenses/*.txt "$pkg/"
          cd "$pkg"
          sha256sum *.exe *LICENSE.txt > SHA256SUMS.txt
          python -m zipfile -c ../chronomorph-windows-amd64.zip *.exe *.txt
          cd ..
          python -m zipfile -e chronomorph-windows-amd64.zip zip-check
          cd zip-check
          sha256sum -c SHA256SUMS.txt
          cmp "$exe" "../Windows package test/$exe"
      - name: Test standalone Windows GUI, tray and signed Wintun driver
        shell: pwsh
        run: |
          $env:CHRONOMORPH_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Windows package test/ChronoMorph-windows-amd64.exe'
          $env:CHRONOMORPH_TEST_WINTUN = '1'
          $env:CHRONOMORPH_PREVIEW = Join-Path $env:RUNNER_TEMP 'ChronoMorph-desktop.png'
          $env:CHRONOMORPH_LIVE_PREVIEW = Join-Path $env:RUNNER_TEMP 'ChronoMorph-connections.png'
          go test -count=1 -mod=readonly -v ./...
          exit $LASTEXITCODE
      - name: Test in-process REALITY with current and v1.4.2 peers
        shell: pwsh
        run: |
          $origin = Join-Path $env:RUNNER_TEMP 'test-origin.exe'
          go build -mod=readonly -o $origin tests/testdata/reality_origin.go
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $client = Join-Path $env:RUNNER_TEMP 'Windows package test/ChronoMorph-windows-amd64.exe'
          python tests/reality_loopback.py $client $origin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $old = Join-Path $env:RUNNER_TEMP 'previous'
          gh release download v1.4.2 --pattern chronomorph-windows-amd64.zip --dir $old
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive (Join-Path $old 'chronomorph-windows-amd64.zip') (Join-Path $old 'server')
          $peer = Join-Path $old 'server/ChronoMorph-windows-amd64.exe'
          python tests/reality_loopback.py $client $origin $peer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/cm_chain.py $client $origin $peer
          exit $LASTEXITCODE
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/ChronoMorph-windows-amd64.exe
            ${{ runner.temp }}/ChronoMorph-desktop.png
            ${{ runner.temp }}/ChronoMorph-connections.png
            ${{ runner.temp }}/chronomorph-windows-amd64.zip
          if-no-files-found: error
  release:
    needs: windows
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify modules and test
        run: |
          go mod verify
          go test -mod=readonly -v ./...
          bash tests/debian-install.sh
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Build and verify release files
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p release
          build_date=$(git show -s --format=%cs HEAD)
          flags="-s -w -X main.AppVersion=${VERSION} -X main.BuildTime=${build_date}"
          build() {
            GOOS="$1" GOARCH="$2" go build -mod=readonly -trimpath -buildvcs=false -ldflags="$flags ${4:-}" -o "release/$3" .
          }
          build linux amd64 chronomorph-linux-amd64
          build linux arm64 chronomorph-linux-arm64
          build android arm64 chronomorph_android_arm64
          release/chronomorph-linux-amd64 version
          bash tests/debian-certificate.sh release/chronomorph-linux-amd64
          bash tests/website-debian.sh release/chronomorph-linux-amd64
          python3 tests/tls_loopback.py release/chronomorph-linux-amd64
          python3 tests/tls_loopback.py release/chronomorph-linux-amd64 --dual --basic
          python3 tests/tls_loopback.py release/chronomorph-linux-amd64 --tls-only --dual --basic
          python3 tests/udp_rebind.py release/chronomorph-linux-amd64 --idle --isolate --restart
          python3 tests/udp_rebind.py release/chronomorph-linux-amd64 --first-loss --outage
          python3 tests/throughput.py release/chronomorph-linux-amd64 --transport tcp --mib 4 --runs 2 --min-mbps 20
          for arch in amd64 arm64; do
            mkdir -p "bridges/reality-linux-$arch"
            GOOS=linux GOARCH="$arch" go build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "bridges/reality-linux-$arch/cm-reality" ./integrations/reality
          done
          install -m 755 bridges/reality-linux-amd64/cm-reality release/cm-reality
          go build -trimpath -o "$RUNNER_TEMP/test-origin" tests/testdata/reality_origin.go
          python3 tests/reality_loopback.py release/chronomorph-linux-amd64 "$RUNNER_TEMP/test-origin"
          rm release/cm-reality
          cp cm.sh setup_win.ps1 uninstall_win.ps1 client.example.json release/
          for arch in amd64 arm64; do
            pkg="chronomorph-debian-$arch"
            mkdir -p "packages/$pkg"
            cp release/cm.sh "release/chronomorph-linux-$arch" "packages/$pkg/"
            cp assets/licenses/Xray-LICENSE.txt assets/licenses/REALITY-LICENSE.txt "packages/$pkg/"
            install -m 755 "bridges/reality-linux-$arch/cm-reality" "packages/$pkg/cm-reality"
            (cd "packages/$pkg" && sha256sum *LICENSE.txt cm-reality cm.sh "chronomorph-linux-$arch" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
            tar -C packages -czf "release/$pkg.tar.gz" "$pkg"
          done
          cd release
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Verify the published Windows EXE and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(mktemp -d)
          for asset in ChronoMorph-windows-amd64.exe chronomorph-windows-amd64.zip; do
            gh release download "$VERSION" --pattern "$asset" --dir "$published"
            cmp "$published/$asset" "release/$asset"
          done
      - name: Verify both published Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source cm.sh
          for arch in amd64 arm64; do
            work=$(mktemp -d)
            fetch_release_package "$work" "chronomorph-linux-$arch" "$VERSION"
            pkg="$work/chronomorph-debian-$arch"
            cmp "$pkg/cm.sh" cm.sh
            cmp "$pkg/chronomorph-linux-$arch" "release/chronomorph-linux-$arch"
            cmp "$pkg/cm-reality" "bridges/reality-linux-$arch/cm-reality"
            rm -rf "$work"
          done
